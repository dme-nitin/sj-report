<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Report</title>
<style>
  :root{
    --navy:#1f4e78;
    --navy-dark:#163a58;
    --header-bg:#d9e1f2;
    --border:#8fa8c4;
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#1c2b3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
    color:var(--text);
  }
  .wrap{
    max-width:1300px;
    margin:0 auto;
    background:var(--card);
    border-radius:10px;
    box-shadow:0 2px 10px rgba(31,78,120,0.12);
    padding:20px;
  }
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:10px;
  }
  .toolbar h2{
    margin:0;
    color:var(--navy-dark);
    font-size:18px;
  }
  .btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-family:inherit;
  }
  .btn:hover{background:var(--navy-dark);}
  table{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
  }
  th, td{
    border:1px solid var(--border);
    padding:8px 10px;
    text-align:center;
    font-size:13px;
  }
  th.points-col{
    text-align:center;
    color:var(--navy-dark);
    font-weight:bold;
    width:210px;
  }
  td.points-col{
    text-align:left;
    color:var(--navy-dark);
    font-weight:bold;
    width:210px;
  }
  thead th{
    background:var(--header-bg);
    color:var(--navy-dark);
    font-weight:bold;
  }
  .title-row th{
    background:var(--header-bg);
    font-size:15px;
    color:var(--navy-dark);
    letter-spacing:0.3px;
  }
  td input{
    width:100%;
    border:none;
    text-align:center;
    font-family:inherit;
    font-size:13px;
    background:transparent;
    color:var(--text);
  }
  td input:focus{
    outline:2px solid var(--navy);
    outline-offset:-2px;
    background:#eef3fa;
    border-radius:3px;
  }
  td.total-cell, th.total-col{
    background:#eef3fa;
    font-weight:bold;
    color:var(--navy-dark);
  }
  .hint{
    font-size:12px;
    color:#5a7089;
    margin-top:10px;
  }
  .sync-status{
    font-size:12px;
    color:#5a7089;
  }
  .sync-status.saved{color:#2e7d32;}
  .sync-status.saving{color:#b8860b;}
  .sync-status.error{color:#c0392b;}
  @media (max-width:800px){
    body{padding:10px;}
    th,td{font-size:11px;padding:5px 4px;}
    td.points-col, th.points-col{width:120px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h2>Daily Report</h2>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="syncStatus" class="sync-status">Connecting to sheet…</span>
      <button class="btn" onclick="loadFromSheet()">Refresh</button>
    </div>
  </div>

  <table id="reportTable">
    <thead>
      <tr class="title-row">
        <th class="points-col" rowspan="2">Points</th>
        <th colspan="6">REPORT OF LAST DAY</th>
        <th class="total-col" rowspan="2">TOTAL</th>
      </tr>
      <tr>
        <th>MANJU</th>
        <th>SONAM</th>
        <th>MADHUSMITA</th>
        <th>BEENA</th>
        <th>BANGALORE DR</th>
        <th>MBBS DOER</th>
      </tr>
    </thead>
    <tbody id="reportBody">
    </tbody>
  </table>
</div>

<script>
// PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE (ends in /exec)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXWcQemvalYohx9jOO0lMXiC8nNGvgsy8RYzY_QBK42nnW00FZgcydxhsh1H-E2rOs/exec";

const points = [
  "August month Documents",
  "August month applications",
  "Pending in Step 5 (sep 2026)",
  "Pending in Step 6 (sep 2026)",
  "DR 2027 students",
  "Hot Students",
  "Reference Students",
  "Previous day approval",
  "Jan 2027 applied"
];

const numCols = 6;
const body = document.getElementById('reportBody');
const statusEl = document.getElementById('syncStatus');

points.forEach((point, rowIndex) => {
  const tr = document.createElement('tr');

  const labelTd = document.createElement('td');
  labelTd.className = 'points-col';
  labelTd.textContent = point;
  tr.appendChild(labelTd);

  for (let c = 0; c < numCols; c++){
    const td = document.createElement('td');
    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.dataset.row = rowIndex;
    input.dataset.col = c;
    input.addEventListener('input', onCellEdit);
    td.appendChild(input);
    tr.appendChild(td);
  }

  const totalTd = document.createElement('td');
  totalTd.className = 'total-cell';
  totalTd.id = 'rowTotal' + rowIndex;
  totalTd.textContent = '0';
  tr.appendChild(totalTd);

  body.appendChild(tr);
});

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = 'sync-status ' + (cls || '');
}

function recalcLocal(rowIndex){
  let rowSum = 0;
  for (let c = 0; c < numCols; c++){
    const input = document.querySelector(`input[data-row="${rowIndex}"][data-col="${c}"]`);
    const val = parseFloat(input.value) || 0;
    rowSum += val;
  }
  document.getElementById('rowTotal' + rowIndex).textContent = rowSum;
}

// Load current values from the Google Sheet when the page opens
async function loadFromSheet(){
  if (SCRIPT_URL.includes('PASTE_YOUR')) {
    setStatus('Sheet not connected yet - add your Web App URL in the code.', 'error');
    return;
  }
  try {
    setStatus('Loading from sheet…', 'saving');
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message || 'bad response');

    json.data.forEach((rowData, rowIndex) => {
      rowData.values.forEach((val, c) => {
        const input = document.querySelector(`input[data-row="${rowIndex}"][data-col="${c}"]`);
        if (input) input.value = (val === "" || val === null) ? "" : val;
      });
      document.getElementById('rowTotal' + rowIndex).textContent = rowData.total || 0;
    });

    setStatus('Connected - synced with sheet', 'saved');
  } catch (err) {
    setStatus('Could not load from sheet', 'error');
  }
}

// Debounce so we don't fire a request on every keystroke
let saveTimers = {};
function onCellEdit(e){
  const input = e.target;
  const row = input.dataset.row;
  const col = input.dataset.col;
  recalcLocal(row);

  const key = row + '_' + col;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => saveCell(row, col, input.value), 500);
}

async function saveCell(row, col, value){
  if (SCRIPT_URL.includes('PASTE_YOUR')) {
    setStatus('Sheet not connected yet - add your Web App URL in the code.', 'error');
    return;
  }
  try {
    setStatus('Saving…', 'saving');
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ row: Number(row), col: Number(col), value: value })
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message || 'bad response');
    document.getElementById('rowTotal' + row).textContent = json.total;
    setStatus('Saved to sheet (OK)', 'saved');
  } catch (err) {
    setStatus('Save failed - check connection', 'error');
  }
}

loadFromSheet();
</script>
</body>
</html>
