<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Edge Dashboard</title>
<style>
  :root{
    --navy:#1f4e78;
    --navy-dark:#163a58;
    --header-bg:#d9e1f2;
    --border:#8fa8c4;
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#1c2b3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
    color:var(--text);
  }
  .wrap{
    max-width:1300px;
    margin:0 auto;
  }

  /* ===== HEADER ===== */
  .dash-header{
    background:linear-gradient(135deg, #3a4657 0%, #2c3644 60%, #232b38 100%);
    border-radius:14px;
    padding:20px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
    margin-bottom:20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,0.94);
    padding:10px 18px;
    border-radius:10px;
  }
  .brand-logo{
    width:46px;
    height:46px;
    flex-shrink:0;
  }
  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.15;
  }
  .brand-name{
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:0.5px;
    background:linear-gradient(90deg, #1f6fd6 0%, #2fa7d6 55%, #1f6fd6 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:#1f6fd6;
  }
  .brand-tagline{
    font-size:12px;
    font-weight:bold;
    color:#e0562f;
    letter-spacing:0.3px;
    margin-top:2px;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .refresh-btn{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 2px 6px rgba(37,99,235,0.4);
  }
  .refresh-btn:hover{background:#1d4ed8;}
  .refresh-icon{
    display:inline-block;
    transition:transform 0.5s ease;
  }
  .refresh-btn.spinning .refresh-icon{
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .sync-status{
    font-size:12px;
    color:#c7d2e0;
    white-space:nowrap;
  }
  .sync-status.saved{color:#4ade80;}
  .sync-status.saving{color:#facc15;}
  .sync-status.error{color:#f87171;}

  /* ===== NAV CARDS ===== */
  .nav-cards{
    display:grid;
    grid-template-columns:1fr;
    gap:11px;
    margin-bottom:24px;
  }
  .nav-card{
    background:linear-gradient(135deg, #ffffff 0%, #f5f8fc 100%);
    border:1px solid #e3e9f2;
    border-radius:14px;
    padding:20px 195px;
    min-height:39px;
    width:fit-content;
    justify-self:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    color:var(--text);
    box-shadow:0 2px 8px rgba(31,78,120,0.06);
    transition:box-shadow 0.2s ease, transform 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-card:hover{
    box-shadow:0 6px 18px rgba(31,78,120,0.14);
    transform:translateY(-2px);
  }
  .nav-card .dot{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
  }
  .nav-card.mj .dot{background:#8b5cf6;}
  .nav-card.sj .dot{background:#ef4444;}

  /* ===== CONTENT SECTIONS ===== */
  .section{display:none;}
  .section.active{display:block;}

  .back-btn{
    background:none;
    border:none;
    color:var(--navy);
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:14px;
    padding:8px 0;
    font-family:inherit;
  }
  .back-btn:hover{text-decoration:underline;}

  .placeholder-card{
    background:var(--card);
    border-radius:14px;
    padding:60px 24px;
    text-align:center;
    color:#5a7089;
    box-shadow:0 2px 10px rgba(31,78,120,0.08);
  }

  /* ===== REPORT TABLE (SJ section) ===== */
  .report-card{
    background:var(--card);
    border-radius:14px;
    box-shadow:0 2px 10px rgba(31,78,120,0.12);
    padding:20px;
  }
  .report-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:10px;
  }
  .report-toolbar h2{
    margin:0;
    color:var(--navy-dark);
    font-size:18px;
  }
  .btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-family:inherit;
  }
  .btn:hover{background:var(--navy-dark);}
  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:8px;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:640px;
    table-layout:fixed;
  }
  th, td{
    border:1px solid var(--border);
    padding:8px 10px;
    text-align:center;
    font-size:13px;
  }
  th.points-col{
    text-align:center;
    color:var(--navy-dark);
    font-weight:bold;
    width:150px;
    position:sticky;
    left:0;
    z-index:2;
    background:var(--header-bg);
  }
  td.points-col{
    text-align:left;
    color:var(--navy-dark);
    font-weight:bold;
    width:150px;
    position:sticky;
    left:0;
    z-index:1;
    background:#fbfcfe;
  }
  thead th{
    background:var(--header-bg);
    color:var(--navy-dark);
    font-weight:bold;
  }
  .title-row th{
    background:var(--header-bg);
    font-size:15px;
    color:var(--navy-dark);
    letter-spacing:0.3px;
  }
  td input{
    width:100%;
    border:none;
    text-align:center;
    font-family:inherit;
    font-size:13px;
    background:transparent;
    color:var(--text);
  }
  td input:focus{
    outline:2px solid var(--navy);
    outline-offset:-2px;
    background:#eef3fa;
    border-radius:3px;
  }
  td.total-cell, th.total-col{
    background:#eef3fa;
    font-weight:bold;
    color:var(--navy-dark);
  }

  /* ===== TABLET (~800px and below) ===== */
  @media (max-width:800px){
    body{padding:14px;}
    .dash-header{
      padding:16px;
      flex-direction:column;
      align-items:stretch;
    }
    .brand{
      justify-content:center;
    }
    .header-right{
      justify-content:space-between;
    }
    .brand-name{font-size:19px;}
    .nav-cards{grid-template-columns:1fr;}
    .nav-card{padding:16px;}
    th,td{font-size:12px;padding:7px 6px;}
    td.points-col, th.points-col{width:130px;}
  }

  /* ===== PHONE (~480px and below) ===== */
  @media (max-width:480px){
    body{padding:10px;}
    .wrap{max-width:100%;}
    .dash-header{
      padding:14px;
      border-radius:12px;
      gap:12px;
    }
    .brand{
      padding:8px 12px;
      gap:10px;
    }
    .brand-logo{width:38px;height:38px;}
    .brand-name{font-size:16px;letter-spacing:0.3px;}
    .brand-tagline{font-size:10px;}
    .header-right{
      flex-direction:row-reverse;
      justify-content:space-between;
      align-items:center;
    }
    .refresh-btn{
      flex:1;
      justify-content:center;
      padding:10px 12px;
      font-size:13px;
    }
    .sync-status{font-size:11px;}
    .nav-card{
      padding:13px 32px;
      border-radius:12px;
    }
    .report-card{padding:12px;border-radius:12px;}
    .report-toolbar h2{font-size:16px;}
    .back-btn{font-size:13px;margin-bottom:10px;}
    table{min-width:600px;}
    th,td{font-size:11px;padding:6px 5px;}
    td.points-col, th.points-col{width:110px;}
    /* Prevent iOS auto-zoom on input focus */
    td input{font-size:16px;padding:2px 0;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== HEADER ===== -->
  <div class="dash-header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="36" r="22" fill="#1f6fd6"/>
        <path d="M12 30 Q32 22 52 30" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
        <path d="M12 42 Q32 50 52 42" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
        <ellipse cx="32" cy="36" rx="8" ry="22" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
        <g>
          <polygon points="32,6 58,16 32,26 6,16" fill="#111827"/>
          <polygon points="32,26 6,16 6,20 32,30 58,20 58,16" fill="#1f2937"/>
          <line x1="46" y1="18" x2="46" y2="30" stroke="#111827" stroke-width="2"/>
          <circle cx="46" cy="32" r="3" fill="#e0562f"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">GLOBAL EDGE</span>
        <span class="brand-tagline">Education Simplified</span>
      </div>
    </div>

    <div class="header-right">
      <span id="syncStatus" class="sync-status">Ready</span>
      <button class="refresh-btn" id="refreshBtn" onclick="handleRefreshClick()">
        <span class="refresh-icon">&#8635;</span> Refresh Data
      </button>
    </div>
  </div>

  <!-- ===== DASHBOARD (nav cards) ===== -->
  <div class="section active" id="dashboardSection">
    <div class="nav-cards">
      <div class="nav-card mj" onclick="showSection('mj')">
        <span class="dot"></span> MJ
      </div>
      <div class="nav-card sj" onclick="showSection('sj')">
        <span class="dot"></span> SJ
      </div>
    </div>
  </div>

  <!-- ===== MJ SECTION (unchanged / placeholder) ===== -->
  <div class="section" id="mjSection">
    <button class="back-btn" onclick="showSection('dashboard')">&larr; Back to Dashboard</button>
    <div class="placeholder-card">
      MJ section — no changes made here.
    </div>
  </div>

  <!-- ===== SJ SECTION (existing report, moved here) ===== -->
  <div class="section" id="sjSection">
    <button class="back-btn" onclick="showSection('dashboard')">&larr; Back to Dashboard</button>

    <div class="report-card">
      <div class="report-toolbar">
        <h2>Daily Report</h2>
      </div>

      <div class="table-scroll">
        <table id="reportTable">
          <thead>
            <tr class="title-row">
              <th class="points-col" rowspan="2">Points</th>
              <th colspan="6">REPORT OF LAST DAY</th>
              <th class="total-col" rowspan="2">TOTAL</th>
            </tr>
            <tr>
              <th>MANJU</th>
              <th>SONAM</th>
              <th>MADHUSMITA</th>
              <th>BEENA</th>
              <th>BANGALORE DR</th>
              <th>MBBS DOER</th>
            </tr>
          </thead>
          <tbody id="reportBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
// PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE (ends in /exec)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXWcQemvalYohx9jOO0lMXiC8nNGvgsy8RYzY_QBK42nnW00FZgcydxhsh1H-E2rOs/exec";

const points = [
  "August month Documents",
  "August month applications",
  "Pending in Step 5 (sep 2026)",
  "Pending in Step 6 (sep 2026)",
  "DR 2027 students",
  "DR Total Students",
  "Hot Students",
  "Reference Students",
  "Previous day approval",
  "Jan 2027 applied"
];

const numCols = 6;
const reportBody = document.getElementById('reportBody');
const statusEl = document.getElementById('syncStatus');
const refreshBtn = document.getElementById('refreshBtn');
let reportLoaded = false;

points.forEach((point, rowIndex) => {
  const tr = document.createElement('tr');

  const labelTd = document.createElement('td');
  labelTd.className = 'points-col';
  labelTd.textContent = point;
  tr.appendChild(labelTd);

  for (let c = 0; c < numCols; c++){
    const td = document.createElement('td');
    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.dataset.row = rowIndex;
    input.dataset.col = c;
    input.addEventListener('input', onCellEdit);
    td.appendChild(input);
    tr.appendChild(td);
  }

  const totalTd = document.createElement('td');
  totalTd.className = 'total-cell';
  totalTd.id = 'rowTotal' + rowIndex;
  totalTd.textContent = '0';
  tr.appendChild(totalTd);

  reportBody.appendChild(tr);
});

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = 'sync-status ' + (cls || '');
}

function recalcLocal(rowIndex){
  let rowSum = 0;
  for (let c = 0; c < numCols; c++){
    const input = document.querySelector(`input[data-row="${rowIndex}"][data-col="${c}"]`);
    const val = parseFloat(input.value) || 0;
    rowSum += val;
  }
  document.getElementById('rowTotal' + rowIndex).textContent = rowSum;
}

async function loadFromSheet(){
  if (SCRIPT_URL.includes('PASTE_YOUR')) {
    setStatus('Sheet not connected yet', 'error');
    return;
  }
  try {
    refreshBtn.classList.add('spinning');
    setStatus('Loading from sheet…', 'saving');
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message || 'bad response');

    json.data.forEach((rowData, rowIndex) => {
      rowData.values.forEach((val, c) => {
        const input = document.querySelector(`input[data-row="${rowIndex}"][data-col="${c}"]`);
        if (input) input.value = (val === "" || val === null) ? "" : val;
      });
      document.getElementById('rowTotal' + rowIndex).textContent = rowData.total || 0;
    });

    setStatus('Connected - synced with sheet', 'saved');
    reportLoaded = true;
  } catch (err) {
    setStatus('Could not load from sheet', 'error');
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

let saveTimers = {};
function onCellEdit(e){
  const input = e.target;
  const row = input.dataset.row;
  const col = input.dataset.col;
  recalcLocal(row);

  const key = row + '_' + col;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => saveCell(row, col, input.value), 500);
}

async function saveCell(row, col, value){
  if (SCRIPT_URL.includes('PASTE_YOUR')) {
    setStatus('Sheet not connected yet', 'error');
    return;
  }
  try {
    setStatus('Saving…', 'saving');
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ row: Number(row), col: Number(col), value: value })
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message || 'bad response');
    document.getElementById('rowTotal' + row).textContent = json.total;
    setStatus('Saved to sheet (OK)', 'saved');
  } catch (err) {
    setStatus('Save failed - check connection', 'error');
  }
}

function handleRefreshClick(){
  loadFromSheet();
}

function showSection(name){
  document.getElementById('dashboardSection').classList.remove('active');
  document.getElementById('mjSection').classList.remove('active');
  document.getElementById('sjSection').classList.remove('active');

  if (name === 'dashboard'){
    document.getElementById('dashboardSection').classList.add('active');
  } else if (name === 'mj'){
    document.getElementById('mjSection').classList.add('active');
  } else if (name === 'sj'){
    document.getElementById('sjSection').classList.add('active');
    if (!reportLoaded) loadFromSheet();
  }
}
</script>
</body>
</html>
